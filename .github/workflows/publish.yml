# Publish to npm when a version tag is pushed.
#
# Trigger: `git tag -s v0.1.2 -m "dsh-notify-zeta 0.1.2" && git push origin v0.1.2`.
# The tag must equal the version in package.json; the job refuses a mismatch
# so a stale package.json cannot ship under a newer tag.
#
# Credentials: npm trusted publishing (OIDC). The trusted publisher on npmjs.com
# names this repository and this workflow file, `id-token: write` lets npm mint
# the short-lived token, and no `.npmrc` may carry an auth token on that path,
# which is why setup-node runs without `registry-url`. A granular token stored
# as the NPM_TOKEN repository secret is used instead only when it is set.
#
# Provenance attestation is switched on only while the repository is public:
# npm does not generate provenance for a private repository.
#
# Tests run on Windows because the suite exercises the native PowerShell
# card; publishing runs on Ubuntu, the runner the npm OIDC exchange is
# exercised on by the sibling dsh-roles-zeta workflow.
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles an older one.
      - run: npm install -g npm@latest

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "publishing with the NPM_TOKEN secret"
          else
            echo "publishing with npm trusted publishing (OIDC)"
          fi
          echo "provenance: $NPM_CONFIG_PROVENANCE"
          npm publish --access public

      # A GitHub Release per published version: the same tarball npm received,
      # the install command, README links, and GitHub's generated change notes.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="$(npm pack --silent)"
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          cat > release-notes.md <<EOF
          Install or update:

          \`\`\`sh
          npx @deepseek-ai/dsh plugin --profile web add dsh-notify-zeta@$version
          # restart the host
          \`\`\`

          README: [English]($base/README.md) · [繁體中文]($base/README.zh-TW.md) · [简体中文]($base/README.zh-CN.md)
          EOF
          gh release create "$GITHUB_REF_NAME" "$tarball" --title "Zeta Notify $version" --notes-file release-notes.md --generate-notes
